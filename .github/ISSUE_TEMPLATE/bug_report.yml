name: Bug report
description: Something didn't work, looked wrong, or was confusing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead. Screenshots welcome; the panel shows no account details, only usage and plan.
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Widget state
      description: "Paste the output of: `omarchy shell io.github.maplepreneur.omarchy-windscribe debug`, it contains no account details."
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`omarchy version`, and the plugin version from `omarchy plugin list --json`"
      placeholder: "Omarchy 4.x, Windscribe 1.0.0, windscribe-cli 2.25.8"
  - type: dropdown
    id: theme
    attributes:
      label: Does it happen in another Omarchy theme too?
      options: ["Didn't try", "Yes", "No, only this theme"]
